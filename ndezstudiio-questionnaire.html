<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0D10; --surface: #15171C; --surface-raised: #1B1E25;
    --border: #272B33; --border-soft: #1E212A;
    --text: #F3F1EC; --text-dim: #9C9EA8; --text-faint: #63656F;
    --accent: #7C5CFF; --accent-soft: rgba(124,92,255,0.14);
    --amber: #FFB84D; --success: #4ADE80; --danger: #FF6B6B;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100vh; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center-pad { display:flex; justify-content:center; padding:80px 0; color: var(--text-dim); }

  .header { display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border-soft); }
  .wordmark { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px;
    display:flex; align-items:center; gap:8px; letter-spacing:-0.01em; }
  .wordmark-dot { color: var(--accent); font-size:10px; }
  .wordmark-sub { font-family:'Inter',sans-serif; font-weight:500; font-size:12px;
    color: var(--text-faint); margin-left:8px; padding-left:8px; border-left:1px solid var(--border); }
  .header-right { display:flex; align-items:center; gap:14px; }
  .save-indicator { display:flex; align-items:center; gap:5px; font-size:12px; color: var(--text-faint); }
  .pid { font-family:'Space Grotesk',sans-serif; font-size:12px; color: var(--text-dim);
    background: var(--surface); border:1px solid var(--border); padding:5px 10px; border-radius:6px; }

  .shell { display:flex; max-width: 1080px; margin: 0 auto;
    padding: 36px 24px 80px; gap: 48px; align-items:flex-start; }
  .main { flex:1; min-width:0; }
  .card { background: var(--surface); border:1px solid var(--border-soft); border-radius:16px;
    padding: 40px; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }

  .rail { width: 230px; flex-shrink:0; position: sticky; top: 24px; }
  .rail-progress { margin-bottom: 22px; }
  .rail-progress-track { height:3px; background: var(--border); border-radius:2px;
    overflow:hidden; margin-bottom:8px; }
  .rail-progress-fill { height:100%; background: linear-gradient(90deg, var(--accent), var(--amber));
    transition: width 0.35s ease; }
  .rail-progress span { font-size:11px; color: var(--text-faint); }
  .rail-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .rail-item { cursor:pointer; display:flex; align-items:center; gap:10px;
    font-size:13px; padding:9px 10px; border-radius:8px; color: var(--text-faint);
    width:100%; border:none; background:none; text-align:left; font-family:'Inter',sans-serif;
    transition: background 0.15s, color 0.15s; }
  .rail-item:disabled { cursor: default; }
  .rail-num { width:20px; height:20px; border-radius:50%; border:1px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:10px;
    font-family:'Space Grotesk',sans-serif; }
  .rail-done .rail-num { background: var(--accent); border-color: var(--accent); color:#fff; }
  .rail-active { color: var(--text); background: var(--surface-raised); }
  .rail-active .rail-num { border-color: var(--accent); color: var(--accent); }
  .rail-visited:hover { color: var(--text-dim); background: var(--surface-raised); }

  .mobile-progress { display:none; margin-bottom: 18px; }
  .mobile-progress-top { display:flex; justify-content:space-between; font-size:12px;
    color: var(--text-dim); margin-bottom:8px; font-family:'Space Grotesk',sans-serif; }

  .step-title { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700;
    letter-spacing:-0.01em; margin:0 0 6px; }
  .step-subtitle { color: var(--text-dim); font-size:14px; margin: 0 0 30px; line-height:1.5; }
  .section-heading { font-family:'Space Grotesk',sans-serif; font-size:12px; text-transform:uppercase;
    letter-spacing:0.06em; color: var(--amber); margin: 30px 0 4px; }
  .field-stack > div:first-child .section-heading { margin-top:0; }

  .field { margin: 16px 0; }
  .field-label { display:block; font-size:13.5px; font-weight:500; margin-bottom:8px; color: var(--text); }
  .req { color: var(--amber); margin-left:3px; }
  .field-desc { font-size:12.5px; color: var(--text-faint); margin: -4px 0 8px; }
  .field-error { font-size:12px; color: var(--danger); margin: 6px 0 0; }
  .input, .textarea { width:100%; background: var(--bg); border:1px solid var(--border); color: var(--text);
    border-radius:9px; padding:11px 13px; font-size:14px; font-family:'Inter',sans-serif;
    transition: border-color 0.15s; resize: vertical; }
  .input:focus, .textarea:focus { outline:none; border-color: var(--accent); }
  .input-err { border-color: var(--danger) !important; }
  .input::placeholder, .textarea::placeholder { color: var(--text-faint); }

  .option-grid { display:flex; flex-direction:column; gap:8px; }
  .option { cursor:pointer; display:flex; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:9px; padding:11px 13px; font-size:13.5px;
    color: var(--text-dim); background:transparent; font-family:'Inter',sans-serif;
    text-align:left; width:100%;
    transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .option:hover { border-color: #3A3E4A; }
  .option-active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .radio-dot { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border);
    flex-shrink:0; position:relative; }
  .radio-dot-active { border-color: var(--accent); }
  .radio-dot-active::after { content:''; position:absolute; inset:3px; background: var(--accent); border-radius:50%; }

  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { cursor:pointer; display:flex; align-items:center; gap:5px;
    border:1px solid var(--border); border-radius:999px; padding:8px 14px; font-size:13px;
    color: var(--text-dim); background:transparent; font-family:'Inter',sans-serif;
    transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .chip:hover { border-color: #3A3E4A; }
  .chip-active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }

  .dropzone { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
    border:1.5px dashed var(--border); border-radius:11px; padding:26px 16px; cursor:pointer;
    color: var(--text-faint); font-size:12.5px;
    transition: border-color 0.15s, color 0.15s; }
  .dropzone:hover { border-color: var(--accent); color: var(--text-dim); }
  .file-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .file-chip { display:flex; align-items:center; gap:6px; background: var(--surface-raised);
    border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:12px;
    color: var(--text-dim); }
  .file-chip button { cursor:pointer; display:flex; color: var(--text-faint);
    background:none; border:none; padding:0; }
  .file-chip button:hover { color: var(--danger); }

  .service-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .service-card { cursor:pointer; position:relative; display:flex; flex-direction:column; gap:4px;
    border:1px solid var(--border); border-radius:12px; padding:18px; background: var(--bg);
    text-align:left; font-family:'Inter',sans-serif; color: var(--text);
    transition: border-color 0.15s, background 0.15s; }
  .service-card:hover { border-color:#3A3E4A; }
  .service-card-active { border-color: var(--accent); background: var(--accent-soft); }
  .service-icon { font-size:17px; color: var(--amber); margin-bottom:4px; }
  .service-name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; }
  .service-desc { font-size:12px; color: var(--text-faint); line-height:1.4; }
  .service-check { position:absolute; top:16px; right:16px; width:18px; height:18px; border-radius:5px;
    border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:11px; font-weight:700; }
  .service-check-active { background: var(--accent); border-color: var(--accent); }

  .nav { display:flex; justify-content:space-between; margin-top:36px;
    padding-top:24px; border-top:1px solid var(--border-soft); }
  .btn-primary, .btn-ghost { cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 20px; border-radius:999px; border:none;
    transition: opacity 0.15s, background 0.15s; }
  .btn-primary { background: var(--accent); color:#fff; }
  .btn-primary:hover { opacity:0.9; }
  .btn-primary:disabled { opacity:0.6; cursor:default; }
  .btn-ghost { border:1px solid var(--border); color: var(--text-dim); background:transparent; }
  .btn-ghost:hover { border-color:#3A3E4A; color: var(--text); }
  .btn-ghost:disabled { opacity:0.35; cursor:default; }

  .info-card { max-width:420px; margin: 60px auto; background: var(--surface);
    border:1px solid var(--border-soft); border-radius:16px; padding:36px;
    text-align:center; display:flex; flex-direction:column; align-items:center; color: var(--amber); }
  .info-card h2 { font-family:'Space Grotesk',sans-serif; color: var(--text); font-size:20px; margin: 14px 0 6px; }
  .info-card p { color: var(--text-dim); font-size:13.5px; margin:0 0 20px; line-height:1.5; }
  .info-meta { display:flex; flex-direction:column; gap:4px; background: var(--bg); border:1px solid var(--border);
    border-radius:9px; padding:12px 20px; margin-bottom:22px; width:100%; }
  .info-meta span { font-size:11px; color: var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; }
  .info-meta strong { font-family:'Space Grotesk',sans-serif; color: var(--text); font-size:15px; }
  .info-actions { display:flex; gap:10px; }
  .confirm-icon { color: var(--success); }
  .confirm-icon.error { color: var(--danger); }

  .review-block { border:1px solid var(--border-soft); border-radius:12px; padding:18px 20px; margin-bottom:14px; }
  .review-block-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .review-block-head h3 { font-family:'Space Grotesk',sans-serif; font-size:14.5px; margin:0; }
  .edit-btn { cursor:pointer; display:flex; align-items:center; gap:5px; font-size:12px;
    color: var(--accent); background:none; border:none; padding:0; font-family:'Inter',sans-serif; }
  .edit-btn:hover { opacity:0.8; }
  .review-row { display:flex; justify-content:space-between; gap:20px; padding:7px 0;
    border-top:1px solid var(--border-soft); font-size:13px; }
  .review-row:first-child { border-top:none; }
  .review-row-label { color: var(--text-faint); flex-shrink:0; max-width:55%; }
  .review-row-value { color: var(--text); text-align:right; }
  .review-badges { display:flex; flex-wrap:wrap; gap:8px; }
  .review-badge { background: var(--accent-soft); color: var(--text); border:1px solid var(--accent);
    border-radius:999px; padding:5px 12px; font-size:12px; }

  @media (max-width: 860px) {
    .rail { display:none; }
    .mobile-progress { display:block; }
    .shell { padding: 20px 16px 60px; }
    .card { padding: 24px 18px; }
    .service-grid { grid-template-columns: 1fr; }
    .header { padding: 14px 16px; }
  }
</style>
</head>

/* ==================== HELPERS ==================== */
function genProjectId() {
  const year = new Date().getFullYear();
  const n = Math.floor(10000 + Math.random() * 90000);
  return "NDEZ-" + year + "-" + n;
}
function isEmpty(v) {
  if (v === undefined || v === null) return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === "string") return v.trim() === "";
  return false;
}
function isVisible(q, answers) {
  if (!q.showIf) return true;
  const val = answers[q.showIf.id];
  if (Array.isArray(val)) return val.some((v) => q.showIf.in.includes(v));
  return q.showIf.in.includes(val);
}
function buildVisibleQuestions(selectedGroups) {
  const used = new Set();
  const map = {};
  selectedGroups.forEach((g) => {
    map[g] = QUESTION_BANK[g].filter((q) => {
      if (used.has(q.id)) return false;
      used.add(q.id);
      return true;
    });
  });
  return map;
}
function formatAnswerValue(v) {
  if (Array.isArray(v)) {
    if (v.length === 0) return "—";
    if (typeof v[0] === "object") return v.map((f) => f.name).join(", ");
    return v.join(", ");
  }
  return v;
}
function buildBriefText({ projectId, clientInfo, selectedServices, answers, steps }) {
  const lines = [];
  lines.push("NEW PROJECT BRIEF — " + projectId, "");
  lines.push("CLIENT");
  CLIENT_FIELDS.forEach((f) => lines.push(f.label + ": " + (clientInfo[f.id] || "—")));
  lines.push("", "SERVICES REQUESTED");
  const serviceNames = selectedServices
    .map((id) => (SERVICE_CARDS.find((c) => c.id === id) || {}).name)
    .filter(Boolean);
  lines.push(serviceNames.join(", ") || "—");
  steps.filter((s) => s.kind === "questions").forEach((s) => {
    const visible = s.questions.filter((q) => isVisible(q, answers) && !isEmpty(answers[q.id]));
    if (visible.length === 0) return;
    lines.push("", s.title.toUpperCase());
    visible.forEach((q) => {
      lines.push(q.question + " " + formatAnswerValue(answers[q.id]));
    });
  });
  lines.push("", "— Sent from the Ndezstudiio project intake form —");
  return lines.join("\n");
}
function buildMailtoLink({ projectId, clientInfo, selectedServices, answers, steps }) {
  const subject = "New project brief — " + projectId + " — " + (clientInfo.business_name || clientInfo.full_name || "");
  let body = buildBriefText({ projectId, clientInfo, selectedServices, answers, steps });
  if (body.length > 1800) body = body.slice(0, 1800) + "\n\n[Brief truncated — full details saved under this Project ID.]";
  return "mailto:" + AGENCY_EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
